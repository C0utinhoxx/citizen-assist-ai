function salvarFormulario(form, idExistente) {
  var erro = document.getElementById("form-erro");
  var dados = {
    id: idExistente !== null ? idExistente : Number(form.elements.id.value),
    titulo: String(form.elements.titulo.value || "").trim(),
    categoria: String(form.elements.categoria.value || "").trim(),
    descricao: String(form.elements.descricao.value || "").trim(),
    local: String(form.elements.local.value || "").trim(),
    fonte: String(form.elements.fonte.value || "").trim(),
    verificado_em: String(form.elements.verificado.value || "").trim()
  };

  var problemas = [];
  if (!isFinite(dados.id) || Math.floor(dados.id) !== dados.id || dados.id < 1 || dados.id > 999999) {
    problemas.push("Informe um ID inteiro entre 1 e 999999.");
  }
  if (!dados.titulo) problemas.push("O título não pode ficar vazio.");
  if (!dados.categoria) problemas.push("A categoria não pode ficar vazia.");
  if (!dados.descricao) problemas.push("A descrição não pode ficar vazia.");
  if (!dados.local) problemas.push("O local de atendimento não pode ficar vazio.");
  if (idExistente === null && lista.buscarPorId(dados.id) !== null) {
    problemas.push("Já existe um serviço com esse ID.");
  }

  if (problemas.length) {
    erro.innerHTML = problemas.map(function (p) { return "<div>• " + escapeHtml(p) + "</div>"; }).join("");
    erro.classList.add("visivel");
    erro.scrollIntoView({ behavior: "smooth", block: "nearest" });
    return;
  }

  var documentos = String(form.elements.documentos.value || "").split(/[;\n]+/).map(function (t) { return t.trim(); }).filter(Boolean);
  var palavras = String(form.elements.palavras.value || "").split(/[,;\n]+/).map(function (t) { return t.trim(); }).filter(Boolean);

  if (idExistente === null) {
    var servico = new Servico({
      id: dados.id,
      titulo: dados.titulo,
      categoria: dados.categoria,
      descricao: dados.descricao,
      documentos: documentos,
      local: dados.local,
      fonte: dados.fonte,
      palavras_chave: palavras,
      verificado_em: dados.verificado_em
    });
    if (!lista.inserir(servico)) {
      erro.innerHTML = "<div>• Já existe um serviço com esse ID.</div>";
      erro.classList.add("visivel");
      return;
    }
    toast("Serviço cadastrado.");
  } else {
    lista.atualizar(idExistente, {
      titulo: dados.titulo,
      categoria: dados.categoria,
      descricao: dados.descricao,
      documentos: documentos,
      local: dados.local,
      fonte: dados.fonte,
      palavras_chave: palavras,
      verificado_em: dados.verificado_em
    });
    toast("Serviço atualizado.");
  }

  if (filtro.ordenacao && filtro.ordenacao !== "atual") {
    lista.ordenarPor(filtro.ordenacao);
  }
  salvarServicos();
  fecharSheet();
  render();
}

async function excluirServico(id) {
  var s = lista.buscarPorId(id);
  if (!s) { toast("Serviço não encontrado."); return; }
  var ok = await confirmar('Excluir "' + s.titulo + '"? Esta ação não pode ser desfeita.', {
    titulo: "Excluir serviço",
    texto: "Excluir",
    perigoso: true
  });
  if (!ok) return;
  lista.remover(id);
  salvarServicos();
  render();
  toast("Serviço excluído.");
}

/* ------------------------------ Modal de confirmação ------------------------------ */
function confirmar(mensagem, opcoes) {
  opcoes = opcoes || {};
  return new Promise(function (resolve) {
    resolverConfirmacao = resolve;
    var root = document.getElementById("modal-root");
    root.innerHTML = '<div class="overlay center" data-overlay-modal><div class="modal" role="dialog" aria-modal="true">' +
      "<h2>" + escapeHtml(opcoes.titulo || "Confirmar") + "</h2>" +
      "<p>" + escapeHtml(mensagem) + "</p>" +
      '<div class="modal-actions"><button class="btn btn-secondary" data-modal-cancelar>Cancelar</button>' +
      '<button class="btn ' + (opcoes.perigoso ? "btn-danger" : "btn-primary") + '" data-modal-confirmar>' + escapeHtml(opcoes.texto || "Confirmar") + "</button></div>" +
      "</div></div>";
    var overlay = root.firstElementChild;
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) finalizarConfirmacao(false);
    });
    root.querySelector("[data-modal-cancelar]").addEventListener("click", function () { finalizarConfirmacao(false); });
    var botao = root.querySelector("[data-modal-confirmar]");
    botao.addEventListener("click", function () { finalizarConfirmacao(true); });
    botao.focus();
  });
}

function finalizarConfirmacao(valor) {
  var resolver = resolverConfirmacao;
  resolverConfirmacao = null;
  document.getElementById("modal-root").innerHTML = "";
  if (resolver) resolver(valor);
}

/* --------------------------------- Toast --------------------------------- */
function toast(mensagem) {
  var root = document.getElementById("toast-root");
  if (!root) return;
  while (root.children.length >= 3) root.removeChild(root.firstElementChild);
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = mensagem;
  root.appendChild(el);
  setTimeout(function () {
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 260);
  }, 3000);
}

/* ------------------------------ Eventos da tela ------------------------------ */
function bindView() {
  if (state.screen === "servicos") {
    var entrada = document.getElementById("busca-servicos");
    if (entrada) {
      entrada.addEventListener("input", function () {
        filtro.texto = entrada.value;
        var listaEl = document.getElementById("lista-servicos");
        if (listaEl) listaEl.innerHTML = renderListaServicos();
        var contagem = document.getElementById("contagem-servicos");
        if (contagem) contagem.textContent = textoContagem();
        var limpar = document.querySelector(".search-clear");
        if (limpar) limpar.style.display = entrada.value ? "" : "none";
      });
    }
  }

  if (state.screen === "assistente") {
    var form = document.getElementById("form-pergunta");
    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var campo = document.getElementById("pergunta");
        perguntar(campo ? campo.value : "");
      });
    }
    var campoPergunta = document.getElementById("pergunta");
    if (campoPergunta) {
      campoPergunta.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          var f = document.getElementById("form-pergunta");
          if (f) {
            var evento = document.createEvent("Event");
            evento.initEvent("submit", true, true);
            f.dispatchEvent(evento);
          }
        }
      });
    }
  }

  if (state.screen === "mais") {
    var arquivo = document.getElementById("arquivo-import");
    if (arquivo) {
      arquivo.addEventListener("change", function () {
        if (arquivo.files && arquivo.files[0]) importarBackup(arquivo.files[0]);
        arquivo.value = "";
      });
    }
  }

  if (state.screen === "aparencia") {
    var seletorVoz = document.getElementById("voz-leitura");
    if (seletorVoz) {
      seletorVoz.addEventListener("change", function () {
        prefs.vozLeitura = seletorVoz.value || "";
        salvarPrefs();
        falarTextoNavegador("Olá! Esta é a voz do navegador escolhida para ler as respostas do Citizen Assist.");
      });
    }
    var seletorNatural = document.getElementById("voz-natural");
    if (seletorNatural) {
      seletorNatural.addEventListener("change", function () {
        prefs.vozNatural = seletorNatural.value || "pt-BR-ThalitaNeural";
        salvarPrefs();
        falarTextoNatural("Olá! Esta é a voz natural escolhida para ler as respostas do Citizen Assist.");
      });
    }
  }
}

/* ------------------------------ Cliques globais ------------------------------ */
document.addEventListener("click", async function (e) {
  var alvo = e.target.closest("[data-action]");
  if (!alvo) return;
  var acao = alvo.getAttribute("data-action");

  switch (acao) {
    case "home":
    case "servicos":
    case "assistente":
    case "mais":
    case "categorias":
    case "analise":
    case "indicadores":
    case "historico":
    case "aparencia":
    case "sobre":
      go(acao);
      break;

    case "voltar":
      voltar();
      break;

    case "abrir-servico":
      abrirDetalhe(Number(alvo.getAttribute("data-id")));
      break;

    case "novo-servico":
      abrirFormulario(null);
      break;

    case "editar-servico":
      abrirFormulario(Number(alvo.getAttribute("data-id")), true);
      break;

    case "excluir-servico":
      fecharSheet(false);
      await excluirServico(Number(alvo.getAttribute("data-id")));
      break;

    case "abrir-categoria":
      fecharSheet(false);
      go("categoria", { categoria: alvo.getAttribute("data-categoria") || "" });
      break;

    case "ordenar": {
      var campo = alvo.getAttribute("data-campo");
      if (campo !== "atual") {
        lista.ordenarPor(campo);
        salvarServicos();
      }
      filtro.ordenacao = campo;
      render();
      var rotulos = { titulo: "título", categoria: "categoria", id: "ID" };
      toast(campo === "atual" ? "Ordem mantida." : "Ordenado por " + rotulos[campo] + ".");
      break;
    }

    case "filtrar-categoria":
      filtro.categoria = alvo.getAttribute("data-categoria") || "";
      render();
      break;

    case "limpar-busca":
      filtro.texto = "";
      render();
      break;

    case "alternar-tema":
      prefs.tema = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      salvarPrefs();
      aplicarPreferencias();
      render();
      break;

    case "tema":
      prefs.tema = alvo.getAttribute("data-tema") || "auto";
      salvarPrefs();
      aplicarPreferencias();
      render();
      break;

    case "fonte":
      prefs.fonte = Number(alvo.getAttribute("data-fonte")) || 1;
      salvarPrefs();
      aplicarPreferencias();
      render();
      break;

    case "nota":
      definirNota(Number(alvo.getAttribute("data-nota")) || 5);
      render();
      toast("Obrigado por avaliar!");
      break;

    case "ajudou":
      responderAjuda(true);
      break;

    case "nao-ajudou":
      responderAjuda(false);
      break;

    case "nova-pergunta":
      pararFala();
      ultimaResposta = null;
      atendimentoAtual = null;
      render();
      setTimeout(function () {
        var campo = document.getElementById("pergunta");
        if (campo) campo.focus();
      }, 60);
      break;

    case "ditar":
      alternarDitado();
      break;

    case "focar-campo": {
      if (state.screen !== "assistente") go("assistente");
      setTimeout(function () {
        var campo = document.getElementById("pergunta");
        if (campo) {
          campo.focus();
          campo.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        toast(pareceMac()
          ? "Agora pressione Fn duas vezes (ou o atalho de Ditado) e fale."
          : "Toque no microfone do teclado e fale.");
      }, 80);
      break;
    }

    case "ouvir-resposta":
      alternarFalaResposta();
      break;

    case "ler-respostas":
      prefs.lerRespostas = alvo.getAttribute("data-valor") === "1";
      salvarPrefs();
      render();
      toast(prefs.lerRespostas ? "As respostas serão lidas em voz alta." : "Leitura automática desligada.");
      break;

    case "motor-voz": {
      var valorMotor = alvo.getAttribute("data-valor");
      var querNatural = valorMotor === "natural";
      if (querNatural && !prefs.vozNaturalConviteVisto) {
        var avisoConsentimento = ttsStatus.modo === "teste"
          ? "No modo de teste, o texto da resposta vai apenas para o servidor local. Ativar a voz natural?"
          : "A voz natural envia apenas o texto da resposta para o serviço Azure. A sua pergunta não é enviada. Ativar a voz natural?";
        confirmar(avisoConsentimento, {
          titulo: "Ativar voz natural",
          texto: "Ativar"
        }).then(function (ok) {
          if (!ok) return;
          prefs.motorVoz = "natural";
          prefs.vozNaturalConviteVisto = true;
          salvarPrefs();
          carregarStatusTTS();
          render();
          toast("Voz natural ativada. Use Ouvir teste para conferir.");
        });
        break;
      }
      prefs.motorVoz = querNatural ? "natural" : "navegador";
      prefs.vozNaturalConviteVisto = true;
      salvarPrefs();
      if (prefs.motorVoz === "natural") carregarStatusTTS();
      render();
      toast(prefs.motorVoz === "natural"
        ? "Voz natural ativada. Use Ouvir teste para conferir."
        : "Voz do navegador ativada.");
      break;
    }

    case "ativar-voz-natural":
      prefs.motorVoz = "natural";
      prefs.vozNaturalConviteVisto = true;
      salvarPrefs();
      carregarStatusTTS();
      render();
      toast("Voz natural ativada. Use Ouvir teste para conferir.");
      break;

    case "dispensar-voz-natural":
      prefs.vozNaturalConviteVisto = true;
      salvarPrefs();
      render();
      break;

    case "testar-voz":
      falarTextoNavegador("Olá! Esta é a voz do navegador escolhida para ler as respostas do Citizen Assist.");
      break;

    case "testar-voz-natural":
      if (!ttsStatus.pronto) {
        toast(ttsStatus.aviso || "A voz natural não está disponível. Verifique o servidor e a chave do Azure.");
        break;
      }
      falarTextoNatural("Olá! Esta é a voz natural do Citizen Assist.");
      break;

    case "atualizar-vozes":
      if (window.speechSynthesis && window.speechSynthesis.getVoices) {
        try { window.speechSynthesis.getVoices(); } catch (e) { /* sem vozes */ }
      }
      if (prefs.motorVoz === "natural") {
        carregarStatusTTS();
      }
      render();
      toast("Lista de vozes atualizada.");
      break;

    case "pergunta-exemplo": {
      pararFala();
      var texto = alvo.getAttribute("data-pergunta") || "";
      if (state.screen !== "assistente") go("assistente");
      setTimeout(function () {
        var campo = document.getElementById("pergunta");
        if (campo) { campo.value = texto; campo.focus(); }
      }, 80);
      break;
    }

    case "exportar-csv":
      await exportarCSV();
      break;

    case "exportar-backup":
      await exportarBackup();
      break;

    case "importar-backup": {
      var input = document.getElementById("arquivo-import");
      if (input) input.click();
      else toast("Abra a tela Mais para importar um backup.");
      break;
    }

    case "restaurar-demo":
      await restaurarDemo();
      break;

    case "limpar-historico":
      await limparHistorico();
      break;

    case "fechar-sheet":
      fecharSheet();
      break;
  }
});

/* ------------------------------ Histórico do navegador ------------------------------ */
window.addEventListener("popstate", function (e) {
  if (sheetAberto) {
    fecharSheet();
    if (historyOk) {
      if (navegacoes > 0) navegacoes--;
      try {
        history.pushState({ tela: state.screen, params: state.params }, "");
        navegacoes++;
      } catch (err) {
        historyOk = false;
      }
    }
    return;
  }
  if (navegacoes > 0) navegacoes--;
  var s = e.state;
  if (s && s.tela) {
    state.screen = s.tela;
    state.params = s.params || {};
  } else {
    state.screen = "home";
    state.params = {};
  }
  render();
});

/* ------------------------------- Inicialização ------------------------------- */
function iniciar() {
  carregarTudo();
  aplicarPreferencias();
  try {
    history.replaceState({ tela: "home", params: {} }, "");
    if (!history.state || history.state.tela !== "home") historyOk = false;
  } catch (e) {
    historyOk = false;
  }
  if (window.speechSynthesis && window.speechSynthesis.getVoices) {
    try { window.speechSynthesis.getVoices(); } catch (e) { /* sem vozes */ }
    var aoCarregarVozes = function () {
      if (state.screen === "aparencia") render();
    };
    if (window.speechSynthesis.addEventListener) {
      window.speechSynthesis.addEventListener("voiceschanged", aoCarregarVozes);
    } else {
      window.speechSynthesis.onvoiceschanged = aoCarregarVozes;
    }
  }
  render();
  carregarStatusTTS();
  if (!storageOk) {
    setTimeout(function () {
      toast("Armazenamento bloqueado: exporte um backup para não perder os dados.");
    }, 800);
  }
}

if (window.matchMedia) {
  var consultaTema = window.matchMedia("(prefers-color-scheme: dark)");
  var aoMudarTema = function () {
    if (prefs.tema === "auto") aplicarPreferencias();
  };
  if (consultaTema.addEventListener) consultaTema.addEventListener("change", aoMudarTema);
  else if (consultaTema.addListener) consultaTema.addListener(aoMudarTema);
}

iniciar();

</script>
