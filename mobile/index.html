<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6f8">
<meta name="description" content="Citizen Assist AI — orientação ao cidadão no celular, offline e sem cadastro.">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Citizen Assist">
<title>Citizen Assist AI — Mobile</title>
<script>
  (function () {
    try {
      var prefs = JSON.parse(window.localStorage.getItem("citizenassist.prefs.v1") || "{}");
      var tema = prefs && prefs.tema ? prefs.tema : "auto";
      if (tema === "auto") {
        tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema === "dark" ? "dark" : "light");
      if (prefs && typeof prefs.fonte === "number") {
        document.documentElement.style.setProperty("--font-scale", String(prefs.fonte));
      }
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", tema === "dark" ? "#0a121a" : "#f2f6f8");
    } catch (e) { /* armazenamento bloqueado */ }
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --font-scale: 1;
    --bg: #f2f6f8;
    --bg-grad: radial-gradient(1100px 560px at 85% -10%, #d6f1ec 0%, transparent 60%),
               radial-gradient(900px 500px at -15% 8%, #fef3c7 0%, transparent 55%);
    --topbar-bg: rgba(242, 246, 248, 0.9);
    --surface: #ffffff;
    --surface-2: #eaf1f5;
    --surface-3: #dce7ee;
    --text: #0d1f2d;
    --muted: #5a6b7a;
    --border: #dbe5ec;
    --primary: #0f766e;
    --primary-strong: #0b5f58;
    --primary-soft: #d6f1ec;
    --on-primary: #ffffff;
    --accent: #b45309;
    --accent-soft: #fef3c7;
    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --ok: #15803d;
    --ok-soft: #dcfce7;
    --hero-bg: linear-gradient(150deg, #0f766e 0%, #0b5f58 100%);
    --hero-text: #ffffff;
    --shadow: 0 10px 30px rgba(13, 31, 45, 0.08);
    --shadow-sm: 0 2px 10px rgba(13, 31, 45, 0.06);
    --radius: 20px;
    --nav-h: 66px;
  }

  html[data-theme="dark"] {
    --bg: #0a121a;
    --bg-grad: radial-gradient(1100px 560px at 85% -10%, #0f3a37 0%, transparent 60%),
               radial-gradient(900px 500px at -15% 8%, #3a2c10 0%, transparent 55%);
    --topbar-bg: rgba(10, 18, 26, 0.9);
    --surface: #111d27;
    --surface-2: #172733;
    --surface-3: #203441;
    --text: #e8f1f5;
    --muted: #9fb1bd;
    --border: #243845;
    --primary: #2dd4bf;
    --primary-strong: #5eead4;
    --primary-soft: #0f3a37;
    --on-primary: #062a26;
    --accent: #fbbf24;
    --accent-soft: #3a2c10;
    --danger: #f87171;
    --danger-soft: #3a1717;
    --ok: #4ade80;
    --ok-soft: #123222;
    --hero-bg: linear-gradient(150deg, #115e59 0%, #0f3a37 100%);
    --hero-text: #e8f1f5;
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
  }

  html {
    font-size: calc(17px * var(--font-scale));
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body.sem-rolagem { overflow: hidden; }

  button, input, textarea, select { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: var(--primary); }

  .app-shell {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px);
  }

  /* ---------------- Topo ---------------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: var(--topbar-bg);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .brand-icon {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: var(--hero-bg);
    color: var(--hero-text);
    box-shadow: var(--shadow-sm);
  }

  .brand-text { min-width: 0; }
  .brand-text strong { display: block; font-size: 0.95rem; line-height: 1.15; letter-spacing: -0.01em; }
  .brand-text span { display: block; font-size: 0.7rem; color: var(--muted); }

  .top-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 42px;
    height: 42px;
    flex: none;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 20px; height: 20px; }

  .icone-sol { display: none; }
  html[data-theme="dark"] .icone-sol { display: inline-flex; }
  html[data-theme="dark"] .icone-lua { display: none; }

  /* ---------------- Estrutura ---------------- */
  .view { padding: 14px 16px 0; animation: fade 0.2s ease; }

  .view-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 16px;
  }
  .view-head h1 { margin: 0; font-size: 1.35rem; line-height: 1.15; letter-spacing: -0.02em; }
  .view-head p { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 24px 0 10px;
    font-size: 0.98rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .link-btn {
    border: 0;
    background: transparent;
    color: var(--primary);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
    padding: 4px;
  }

  .sub-title { font-size: 0.84rem; margin: 16px 0 8px; }
  .muted { color: var(--muted); }
  .hint { font-size: 0.72rem; color: var(--muted); }

  /* ---------------- Hero ---------------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 22px 20px;
    border-radius: 26px;
    background: var(--hero-bg);
    color: var(--hero-text);
    box-shadow: var(--shadow);
  }
  .hero::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    right: -64px;
    top: -74px;
    pointer-events: none;
  }
  .hero::before {
    content: "";
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    right: 48px;
    bottom: -70px;
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.82;
  }
  .hero h1 { margin: 6px 0 8px; font-size: 1.55rem; line-height: 1.12; letter-spacing: -0.03em; }
  .hero p { margin: 0 0 18px; font-size: 0.9rem; opacity: 0.92; max-width: 34ch; }

  /* ---------------- Botões ---------------- */
  .btn {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 12px 16px;
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .btn-ghost { background: transparent; color: var(--primary); border-color: var(--border); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-white { background: #ffffff; color: #0b5f58; }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 38px; padding: 8px 12px; font-size: 0.76rem; border-radius: 11px; }
  .btn-lg { min-height: 54px; padding: 14px 18px; font-size: 0.96rem; border-radius: 16px; }

  /* ---------------- Estatísticas e atalhos ---------------- */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 4px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .stat strong { display: block; font-size: 1.3rem; line-height: 1.1; letter-spacing: -0.02em; }
  .stat span { display: block; margin-top: 2px; font-size: 0.68rem; color: var(--muted); }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    cursor: pointer;
    color: var(--text);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .quick:active { transform: scale(0.98); }
  .quick .qi {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: var(--primary-soft);
    color: var(--primary);
  }
  .quick .qi svg { width: 19px; height: 19px; }
  .quick strong { font-size: 0.84rem; line-height: 1.2; }
  .quick small { font-size: 0.7rem; color: var(--muted); line-height: 1.3; }

  /* ---------------- Cartões de serviço ---------------- */
  .service-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .service-card:active { transform: scale(0.985); }
  .service-title { font-weight: 700; font-size: 0.95rem; line-height: 1.3; letter-spacing: -0.01em; }
  .service-desc {
    font-size: 0.79rem;
    color: var(--muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .service-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* ---------------- Chips ---------------- */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  .chip-cat { background: var(--primary-soft); color: var(--primary-strong); }
  html[data-theme="dark"] .chip-cat { color: var(--primary); }
  .chip-alta { background: var(--ok-soft); color: var(--ok); }
  .chip-media { background: var(--accent-soft); color: var(--accent); }
  .chip-baixa { background: var(--danger-soft); color: var(--danger); }
  .chip-neutral { background: var(--surface-2); color: var(--muted); }

  /* ---------------- Avisos ---------------- */
  .notice, .aviso {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 14px;
    border-radius: 16px;
    background: var(--accent-soft);
    color: var(--text);
    font-size: 0.78rem;
    line-height: 1.45;
    margin-top: 16px;
  }
  .notice svg, .aviso svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent); }

  .banner-storage {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 14px;
    background: var(--danger-soft);
    color: var(--text);
    font-size: 0.76rem;
    line-height: 1.4;
  }
  .banner-storage svg { width: 18px; height: 18px; flex: none; color: var(--danger); }

  /* ---------------- Busca e filtros ---------------- */
  .search {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 15px;
    box-shadow: var(--shadow-sm);
  }
  .search > svg { width: 19px; height: 19px; color: var(--muted); flex: none; }
  .search input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 13px 0;
    font: inherit;
    font-size: max(16px, 1rem);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search-clear {
    border: 0;
    background: var(--surface-2);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    flex: none;
  }

  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 10px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip-row.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 4px; }

  .chip-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.73rem;
    font-weight: 600;
    min-height: 36px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .chip-btn.ativo { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

  .sort-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
  .sort-label { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; flex: none; }
  .sort-row .chip-row { padding: 0; flex: 1; }

  .count-line { margin: 0 0 10px; font-size: 0.72rem; color: var(--muted); }

  /* ---------------- Botão flutuante ---------------- */
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    z-index: 35;
    width: 58px;
    height: 58px;
    border: 0;
    border-radius: 19px;
    background: var(--primary);
    color: var(--on-primary);
    box-shadow: 0 12px 26px rgba(15, 118, 110, 0.35);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 26px; height: 26px; }

  @media (min-width: 640px) {
    .fab { right: calc(50vw - 300px + 16px); }
  }

  /* ---------------- Estado vazio ---------------- */
  .empty { text-align: center; padding: 36px 18px; color: var(--muted); }
  .empty .big { font-size: 2rem; line-height: 1; margin-bottom: 10px; }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 0.95rem; }
  .empty p { margin: 0 0 16px; font-size: 0.8rem; }

  /* ---------------- Barra inferior ---------------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; pointer-events: none; }
  .tabbar-inner {
    width: 100%;
    max-width: 600px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.06);
    pointer-events: auto;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 50px;
    padding: 4px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.63rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-icon-wrap { display: grid; place-items: center; width: 34px; height: 28px; border-radius: 10px; transition: background 0.12s ease; }
  .tab svg { width: 22px; height: 22px; }
  .tab.ativo { color: var(--primary); }
  .tab.ativo .tab-icon-wrap { background: var(--primary-soft); }

  /* ---------------- Categorias ---------------- */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    padding: 16px 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    color: var(--text);
    cursor: pointer;
    min-height: 112px;
  }
  .cat-card:active { transform: scale(0.98); }
  .cat-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
  .cat-icon svg { width: 19px; height: 19px; }
  .cat-card strong { font-size: 0.85rem; line-height: 1.25; margin-top: 3px; }
  .cat-card small { font-size: 0.7rem; color: var(--muted); }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: transparent;
    color: var(--primary);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 4px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .back-btn svg { width: 17px; height: 17px; }

  /* ---------------- Assistente ---------------- */
  .ask-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .ask-card label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; }
  .ask-card textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: max(16px, 1rem);
    outline: none;
    line-height: 1.45;
  }
  .ask-card textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .ask-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .ask-foot .hint { display: inline-flex; align-items: center; gap: 5px; max-width: 52%; }
  .ask-foot .hint svg { width: 15px; height: 15px; flex: none; }

  /* ---------------- Voz (idosos) ---------------- */
  .voice-box { margin-bottom: 12px; }
  .btn-voice {
    width: 100%;
    min-height: 60px;
    padding: 14px 18px;
    border: 1px solid var(--accent);
    border-radius: 16px;
    background: var(--accent-soft);
    color: var(--accent);
    font: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .btn-voice svg { width: 27px; height: 27px; flex: none; }
  .btn-voice .voz-icone { display: inline-flex; }
  .btn-voice .voz-stop { display: none; }
  .btn-voice.ouvindo .voz-mic { display: none; }
  .btn-voice.ouvindo .voz-stop { display: inline-flex; }
  .btn-voice:active { transform: scale(0.985); }
  .btn-voice.ouvindo {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
    animation: anel 1.5s ease-out infinite;
  }
  .voice-help { margin: 8px 2px 0; font-size: 0.8rem; line-height: 1.45; color: var(--muted); }
  .voice-help strong { color: var(--text); }
  .voice-live {
    display: none;
    margin-top: 10px;

/* ------------------------------ Utilitários ------------------------------ */
function normalizar(texto) {
  if (texto === null || texto === undefined) return "";
  return String(texto)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function contemPalavra(texto, palavraNormalizada) {
  if (!palavraNormalizada) return false;
  return (" " + normalizar(texto) + " ").indexOf(" " + palavraNormalizada + " ") !== -1;
}

function escapeHtml(valor) {
  return String(valor === null || valor === undefined ? "" : valor).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function escapeAttr(valor) {
  return escapeHtml(valor);
}

function urlSegura(valor) {
  try {
    var url = new URL(String(valor), window.location.href);
    if (url.protocol === "http:" || url.protocol === "https:") return url.href;
  } catch (e) { /* endereço inválido */ }
  return "";
}

function linkFonte(fonte) {
  var url = urlSegura(fonte);
  if (!url) return escapeHtml(fonte);
  return '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(fonte) + "</a>";
}

function resumir(texto, limite) {
  var t = String(texto || "").replace(/\s+/g, " ").trim();
  if (t.length <= limite) return t;
  return t.slice(0, limite - 1).replace(/\s+\S*$/, "") + "…";
}

function dataHoraAtual() {
  var d = new Date();
  function dois(n) { return n < 10 ? "0" + n : String(n); }
  return d.getFullYear() + "-" + dois(d.getMonth() + 1) + "-" + dois(d.getDate()) + " " +
    dois(d.getHours()) + ":" + dois(d.getMinutes()) + ":" + dois(d.getSeconds());
}

function insertionSort(itens, comparar) {
  for (var i = 1; i < itens.length; i++) {
    var atual = itens[i];
    var j = i - 1;
    while (j >= 0 && comparar(itens[j], atual) > 0) {
      itens[j + 1] = itens[j];
      j--;
    }
    itens[j + 1] = atual;
  }
  return itens;
}

/* ------------------------------- Modelo ------------------------------- */
function Servico(dados) {
  this.id = Number(dados.id);
  this.titulo = String(dados.titulo || "").trim();
  this.categoria = String(dados.categoria || "").trim();
  this.descricao = String(dados.descricao || "").trim();
  this.documentos = Array.isArray(dados.documentos) ? dados.documentos.map(function (d) { return String(d).trim(); }).filter(Boolean) : [];
  this.local = String(dados.local || "").trim();
  this.fonte = String(dados.fonte || "").trim();
  this.palavras_chave = Array.isArray(dados.palavras_chave) ? dados.palavras_chave.map(function (p) { return String(p).trim(); }).filter(Boolean) : [];
  this.verificado_em = String(dados.verificado_em || "").trim();
}

Servico.deDict = function (dados) {
  if (!dados || typeof dados !== "object") throw new Error("registro inválido");
  var descricao = dados.descricao !== undefined && dados.descricao !== null ? dados.descricao : dados.resposta;
  if (descricao === undefined || descricao === null) throw new Error("descricao ausente");
  var documentos = dados.documentos;
  if (documentos === undefined || documentos === null) {
    documentos = String(dados.requisitos || "").split(";");
  }
  if (!Array.isArray(documentos)) throw new Error("documentos inválidos");
  var palavras = dados.palavras_chave || [];
  if (!Array.isArray(palavras)) throw new Error("palavras-chave inválidas");
  var id = Number(dados.id);
  if (!isFinite(id) || Math.floor(id) !== id) throw new Error("id inválido");
  return new Servico({
    id: id,
    titulo: dados.titulo,
    categoria: dados.categoria,
    descricao: descricao,
    documentos: documentos,
    local: dados.local !== undefined ? dados.local : dados.onde,
    fonte: dados.fonte,
    palavras_chave: palavras,
    verificado_em: dados.verificado_em
  });
};

Servico.prototype.paraDict = function () {
  return {
    id: this.id,
    titulo: this.titulo,
    categoria: this.categoria,
    descricao: this.descricao,
    documentos: this.documentos.slice(),
    local: this.local,
    fonte: this.fonte,
    palavras_chave: this.palavras_chave.slice(),
    verificado_em: this.verificado_em
  };
};

/* --------------------------- Lista encadeada --------------------------- */
function No(servico) {
  this.servico = servico;
  this.proximo = null;
}

function ListaEncadeada() {
  this.inicio = null;
  this.quantidade = 0;
}

ListaEncadeada.prototype.vazia = function () {
  return this.inicio === null;
};

ListaEncadeada.prototype.inserir = function (servico) {
  if (this.buscarPorId(servico.id) !== null) return false;
  var novo = new No(servico);
  if (this.inicio === null) {
    this.inicio = novo;
  } else {
    var atual = this.inicio;
    while (atual.proximo !== null) atual = atual.proximo;
    atual.proximo = novo;
  }
  this.quantidade++;
  return true;
};

ListaEncadeada.prototype.percorrer = function () {
  var itens = [];
  var atual = this.inicio;
  while (atual !== null) {
    itens.push(atual.servico);
    atual = atual.proximo;
  }
  return itens;
};

ListaEncadeada.prototype.buscarPorId = function (id) {
  var atual = this.inicio;
  while (atual !== null) {
    if (atual.servico.id === id) return atual.servico;
    atual = atual.proximo;
  }
  return null;
};

ListaEncadeada.prototype.pesquisar = function (texto) {
  var termo = normalizar(texto);
  if (!termo) return [];
  var encontrados = [];
  var atual = this.inicio;
  while (atual !== null) {
    var s = atual.servico;
    if (normalizar(s.titulo).indexOf(termo) !== -1 ||
        normalizar(s.categoria).indexOf(termo) !== -1 ||
        normalizar(s.descricao).indexOf(termo) !== -1) {
      encontrados.push(s);
    }
    atual = atual.proximo;
  }
  return encontrados;
};

ListaEncadeada.prototype.atualizar = function (id, campos) {
  var servico = this.buscarPorId(id);
  if (servico === null) return null;
  var permitidos = ["titulo", "categoria", "descricao", "documentos", "local", "fonte", "palavras_chave", "verificado_em"];
  Object.keys(campos).forEach(function (nome) {
    if (permitidos.indexOf(nome) === -1) throw new Error("Campo não pode ser atualizado: " + nome);
    if (campos[nome] !== null && campos[nome] !== undefined) servico[nome] = campos[nome];
  });
  return servico;
};

ListaEncadeada.prototype.remover = function (id) {
  var anterior = null;
  var atual = this.inicio;
  while (atual !== null) {
    if (atual.servico.id === id) {
      if (anterior === null) this.inicio = atual.proximo;
      else anterior.proximo = atual.proximo;
      this.quantidade--;
      return true;
    }
    anterior = atual;
    atual = atual.proximo;
  }
  return false;
};

ListaEncadeada.prototype.ordenarPor = function (campo) {
  if (["id", "titulo", "categoria"].indexOf(campo) === -1) throw new Error("Campo de ordenação inválido.");
  var atual = this.inicio;
  while (atual !== null) {
    var menor = atual;
    var procura = atual.proximo;
    while (procura !== null) {
      if (this._chave(procura.servico, campo) < this._chave(menor.servico, campo)) menor = procura;
      procura = procura.proximo;
    }
    if (menor !== atual) {
      var troca = atual.servico;
      atual.servico = menor.servico;
      menor.servico = troca;
    }
    atual = atual.proximo;
  }
};

ListaEncadeada.prototype._chave = function (servico, campo) {
  return campo === "id" ? servico.id : normalizar(servico[campo]);
};

ListaEncadeada.prototype.contarPorCategoria = function () {
  var contagem = Object.create(null);
  this.percorrer().forEach(function (s) {
    contagem[s.categoria] = (contagem[s.categoria] || 0) + 1;
  });
  return contagem;
};

/* --------------------------- Base de conhecimento --------------------------- */
var PONTOS_ALTA = 6;
var PONTOS_MEDIA = 3;

function BaseConhecimento(lista) {
  this.lista = lista;
}

BaseConhecimento.prototype.categorias = function () {
  var vistas = Object.create(null);
  this.lista.percorrer().forEach(function (s) {
    var chave = normalizar(s.categoria);
    if (chave && !Object.prototype.hasOwnProperty.call(vistas, chave)) vistas[chave] = s.categoria;
  });
  var nomes = Object.keys(vistas).map(function (k) { return vistas[k]; });
  return insertionSort(nomes, function (a, b) {
    var na = normalizar(a), nb = normalizar(b);
    return na < nb ? -1 : (na > nb ? 1 : 0);
  });
};

BaseConhecimento.prototype.porCategoria = function (categoria) {
  var chave = normalizar(categoria);
  return this.lista.percorrer().filter(function (s) {
    return normalizar(s.categoria) === chave;
  });
};

BaseConhecimento.prototype.pontuar = function (pergunta, servico) {
  var perguntaNormalizada = normalizar(pergunta);
  if (!perguntaNormalizada) return 0;
  var pontos = 0;
  servico.palavras_chave.forEach(function (palavraChave) {
    var chave = normalizar(palavraChave);
    if (chave && contemPalavra(pergunta, chave)) pontos += 3;
  });
  var palavras = Object.create(null);
  perguntaNormalizada.split(" ").forEach(function (p) { palavras[p] = true; });
  Object.keys(palavras).forEach(function (palavra) {
    if (palavra.length >= 4 && contemPalavra(servico.titulo, palavra)) pontos += 1;
  });
  return pontos;
};

BaseConhecimento.prototype.buscar = function (pergunta) {
  if (!normalizar(pergunta)) return [];
  var resultados = [];
  this.lista.percorrer().forEach(function (servico) {
    var pontos = this.pontuar(pergunta, servico);
    if (pontos > 0) resultados.push([pontos, servico]);
  }, this);
  return insertionSort(resultados, function (a, b) {
    if (a[0] !== b[0]) return b[0] - a[0];
    return a[1].id - b[1].id;
  });
};

function lerChave(chave) {
  if (storageOk) {

  return Object.prototype.hasOwnProperty.call(memoria, chave) ? memoria[chave] : null;
}

function gravarChave(chave, valor) {

  if (storageOk) {

}

/*
 * Ditado: usa a Web Speech API do próprio navegador (pt-BR).
 * Leitura: usa a voz do aparelho/navegador ou a voz natural Azure opcional.
 * Na voz natural, só o texto da resposta vai ao servidor local; a pergunta
 * nunca é enviada. Nenhum áudio é gravado pelo aplicativo; o navegador pode
 * usar um serviço online de reconhecimento. Se a API não existir, o app
 * orienta a usar o microfone do teclado, que funciona em qualquer campo.
 */
var voz = {
  reconhecimento: null,
  ouvindo: false,
  pararPedido: false,
  base: "",
  final: "",
  parcial: "",
  erro: "",
  falaToken: 0,
  audio: null,
  audioUrl: "",
  ttsCarregando: false,
  ttsAbort: null
};

var VOZES_NATURAIS_PADRAO = [
  { id: "pt-BR-ThalitaNeural", nome: "Thalita", genero: "feminina" },
  { id: "pt-BR-MacerioNeural", nome: "Macerio", genero: "masculina" }
];

var ttsStatus = {
  carregado: false,
  provedor: "",
  modo: "",
  pronto: false,
  voz: "",
  regiao: "",
  aviso: ""
};
var ttsVozes = [];
var ttsCache = {};
var ttsCacheOrdem = [];

function ditadoSuportado() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function ditadoEmContextoSeguro() {
  return window.isSecureContext !== false;
}

function falaSuportada() {
  return !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
}

function audioSuportado() {
  return typeof window.Audio === "function" || typeof Audio === "function";
}

function podeFalar() {
  return falaSuportada() || audioSuportado();
}

function vozesNaturaisDisponiveis() {
  return ttsVozes.length ? ttsVozes : VOZES_NATURAIS_PADRAO;
}

function nomeVozNatural(id) {
  var alvo = String(id || "");
  var vozes = vozesNaturaisDisponiveis();
  for (var i = 0; i < vozes.length; i++) {
    if (vozes[i].id === alvo) {
      return vozes[i].nome + (vozes[i].genero ? " (" + vozes[i].genero + ")" : "");
    }
  }
  return "Thalita (feminina)";
}

function carregarStatusTTS() {
  if (typeof fetch !== "function") {
    ttsStatus = {
      carregado: true,
      provedor: "navegador",
      modo: "offline",
      pronto: false,
      voz: "",
      regiao: "",
      aviso: "Servidor de voz natural não encontrado. A voz do navegador continua funcionando."
    };
    return Promise.resolve(ttsStatus);
  }

  return fetch("/api/tts/status", { cache: "no-store" })
    .then(function (resposta) {
      if (!resposta.ok) throw new Error("status");
      return resposta.json();
    })
    .then(function (dados) {
      ttsStatus = {
        carregado: true,
        provedor: String(dados.provedor || ""),
        modo: String(dados.modo || ""),
        pronto: !!dados.pronto,
        voz: String(dados.voz || ""),
        regiao: String(dados.regiao || ""),
        aviso: String(dados.aviso || "")
      };
      if (ttsStatus.pronto) carregarVozesTTS();
      if (state.screen === "aparencia" && !falaAtiva()) render();
      return ttsStatus;
    })
    .catch(function () {
      ttsStatus = {
        carregado: true,
        provedor: "navegador",
        modo: "offline",
        pronto: false,
        voz: "",
        regiao: "",
        aviso: "Servidor de voz natural não encontrado. A voz do navegador continua funcionando."
      };
      if (state.screen === "aparencia" && !falaAtiva()) render();
      return ttsStatus;
    });
}

function carregarVozesTTS() {
  if (typeof fetch !== "function") return Promise.resolve([]);
  return fetch("/api/tts/voices", { cache: "no-store" })
    .then(function (resposta) {
      if (!resposta.ok) throw new Error("vozes");
      return resposta.json();
    })
    .then(function (dados) {
      ttsVozes = dados && Array.isArray(dados.vozes) ? dados.vozes : [];
      if (state.screen === "aparencia" && !falaAtiva()) render();
      return ttsVozes;
    })
    .catch(function () {
      ttsVozes = [];
      return ttsVozes;
    });
}

function statusTTSHtml() {
  if (!ttsStatus.carregado) {
    return '<div class="voice-status">' + ICONES.info + "<span>Verificando a voz natural…</span></div>";
  }
  if (!ttsStatus.pronto) {
    return '<div class="voice-status erro">' + ICONES.info + "<span>" +
      escapeHtml(ttsStatus.aviso || "Voz natural indisponível. A voz do navegador continua funcionando.") +
      "</span></div>";
  }
  if (ttsStatus.modo === "teste") {
    return '<div class="voice-status teste">' + ICONES.info +
      "<span><strong>Modo de teste</strong> — sem chave do Azure. O áudio serve só para validar o fluxo.</span></div>";
  }
  var regiao = ttsStatus.regiao ? " · " + escapeHtml(ttsStatus.regiao) : "";
  var vozAtual = prefs.vozNatural || ttsStatus.voz;
  return '<div class="voice-status ok">' + ICONES.altoFalante +
    "<span><strong>Azure</strong> · " + escapeHtml(nomeVozNatural(vozAtual)) + regiao + " · pronto</span></div>";
}

function vozesNaturaisOptions() {
  var vozes = vozesNaturaisDisponiveis();
  var escolhida = prefs.vozNatural || "pt-BR-ThalitaNeural";
  return vozes.map(function (v) {
    var id = String(v.id || "");
    return '<option value="' + escapeAttr(id) + '"' + (id === escolhida ? " selected" : "") + ">" +
      escapeHtml(String(v.nome || id) + (v.genero ? " (" + v.genero + ")" : "")) + "</option>";
  }).join("");
}

function limparAudio() {
  if (voz.audio) {
    try { voz.audio.pause(); } catch (e) { /* áudio já parado */ }
    try { voz.audio.src = ""; } catch (e) { /* sem fonte */ }
    voz.audio = null;
  }
  if (voz.audioUrl && typeof URL !== "undefined" && URL.revokeObjectURL) {
    try { URL.revokeObjectURL(voz.audioUrl); } catch (e) { /* URL já liberada */ }
  }
  voz.audioUrl = "";
}

function falaAtiva() {
  if (voz.ttsCarregando) return true;
  if (window.speechSynthesis && window.speechSynthesis.speaking) return true;
  return !!(voz.audio && !voz.audio.paused && !voz.audio.ended);
}

function chaveCacheNatural(texto) {
  return String(ttsStatus.provedor || "") + "\n" + String(ttsStatus.modo || "") + "\n" +
    String(prefs.vozNatural || "") + "\n" + texto;
}

function obterAudioNatural(texto) {
  var chave = chaveCacheNatural(texto);
  if (ttsCache[chave]) return Promise.resolve(ttsCache[chave]);
  if (typeof fetch !== "function") {
    return Promise.reject(new Error("Este navegador não consegue buscar a voz natural."));
  }

  var controlador = null;
  if (typeof AbortController === "function") {
    controlador = new AbortController();
    voz.ttsAbort = controlador;
  }

  return fetch("/api/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ texto: texto, voz: prefs.vozNatural }),
    signal: controlador ? controlador.signal : undefined
  }).then(function (resposta) {
    if (!resposta.ok) {
      return resposta.json().catch(function () { return {}; }).then(function (dados) {
        throw new Error(dados && dados.erro ? dados.erro : "HTTP " + resposta.status);
      });
    }
    return resposta.blob();
  }).then(function (blob) {
    ttsCache[chave] = blob;
    ttsCacheOrdem.push(chave);
    while (ttsCacheOrdem.length > 20) {
      var antigo = ttsCacheOrdem.shift();
      delete ttsCache[antigo];
    }
    return blob;
  }).finally(function () {
    if (voz.ttsAbort === controlador) voz.ttsAbort = null;
  });
}

function falarTextoNatural(texto) {
  var conteudo = String(texto || "").trim();
  if (!conteudo) return false;

  pararFala();
  var token = ++voz.falaToken;
  voz.ttsCarregando = true;
  marcarFalando(true);

  obterAudioNatural(conteudo).then(function (blob) {
    if (token !== voz.falaToken) return false;
    if (!audioSuportado() || typeof URL === "undefined" || !URL.createObjectURL) {
      throw new Error("Este navegador não consegue tocar o áudio da voz natural.");
    }

    var url = URL.createObjectURL(blob);
    var audio = new (window.Audio || Audio)();
    voz.audio = audio;
    voz.audioUrl = url;
    audio.onended = function () {
      if (token !== voz.falaToken) return;
      limparAudio();
      marcarFalando(false);
    };
    audio.onerror = function () {
      if (token !== voz.falaToken) return;
      limparAudio();
      marcarFalando(false);
      toast("Não consegui tocar a voz natural. Vou usar a voz do navegador.");
      if (falaSuportada()) falarTextoNavegador(conteudo);
    };
    audio.src = url;
    voz.ttsCarregando = false;
    marcarFalando(true);
    var reproducao = audio.play();
    if (reproducao && reproducao.catch) {
      return reproducao.catch(function () {
        if (token !== voz.falaToken) return false;
        limparAudio();
        marcarFalando(false);
        toast("O navegador bloqueou o áudio. Toque em Ouvir resposta.");
        if (falaSuportada()) return falarTextoNavegador(conteudo);
        return false;
      });
    }
    return true;
  }).catch(function (erro) {
    if (token !== voz.falaToken) return false;
    voz.ttsCarregando = false;
    marcarFalando(false);
    var mensagem = erro && erro.message ? erro.message : "";
    toast(mensagem ? ("Voz natural indisponível: " + mensagem) : "Voz natural indisponível agora.");
    if (falaSuportada()) return falarTextoNavegador(conteudo);
    return false;
  });

  return true;
}

function pontuarVoz(vozItem) {
  var nome = String(vozItem.name || "").toLowerCase();
  var idioma = String(vozItem.lang || "");
  var pontos = 0;
  if (/^pt[-_]br/i.test(idioma)) pontos += 10;
  if (nome.indexOf("google") !== -1) pontos += 9;
  if (nome.indexOf("natural") !== -1) pontos += 8;
  if (nome.indexOf("neural") !== -1) pontos += 8;
  if (nome.indexOf("enhanced") !== -1 || nome.indexOf("premium") !== -1) pontos += 7;
  if (nome.indexOf("microsoft") !== -1) pontos += 6;
  if (/(luciana|fernanda|maria|joana|daniel|helena|francisca|thalita)/.test(nome)) pontos += 5;
  if (vozItem.localService) pontos += 1;
  return pontos;
}

function vozesPortugues() {
  if (!window.speechSynthesis || !window.speechSynthesis.getVoices) return [];
  var todas = window.speechSynthesis.getVoices() || [];
  var pt = [];
  for (var i = 0; i < todas.length; i++) {
    if (/^pt/i.test(String(todas[i].lang || ""))) pt.push(todas[i]);
  }
  pt.sort(function (a, b) { return pontuarVoz(b) - pontuarVoz(a); });
  return pt;
}

function vozEscolhida() {
  var vozes = vozesPortugues();
  if (!vozes.length) return null;
  var alvo = prefs.vozLeitura;
  if (alvo) {
    for (var i = 0; i < vozes.length; i++) {
      if (vozes[i].voiceURI === alvo || vozes[i].name === alvo) return vozes[i];
    }
  }
  return vozes[0];
}

function nomeCurtoVoz(vozItem) {
  var nome = String(vozItem.name || "Voz");
  var idioma = String(vozItem.lang || "");
  return nome + (idioma ? " (" + idioma + ")" : "");
}

function juntarTextoVoz() {
  var partes = [];
  for (var i = 0; i < arguments.length; i++) {
    var t = String(arguments[i] === null || arguments[i] === undefined ? "" : arguments[i])
      .replace(/\s+/g, " ")
      .trim();
    if (t) partes.push(t);
  }
  return partes.join(" ");
}

function textoParaFalar(servico) {
  if (!servico) return "";
  var partes = [];
  if (servico.titulo) partes.push(String(servico.titulo).replace(/[.!?]+$/, "") + ".");
  if (servico.descricao) partes.push(String(servico.descricao));
  if (servico.documentos && servico.documentos.length) {
    partes.push("Documentos e requisitos: " + servico.documentos.join(". ") + ".");
  }
  if (servico.local) partes.push("Local de atendimento: " + servico.local + ".");
  return partes.filter(Boolean).join(" ");
}

function navegadorPareceSafari() {
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  return /Safari\//.test(ua) && !/Chrome|CriOS|Edg|OPR|Firefox|FxiOS/.test(ua);
}

function pareceMac() {
  var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
  var plataforma = (typeof navigator !== "undefined" && navigator.platform) || "";
  if (/iPad|iPhone|iPod/.test(ua)) return false;
  return /Mac/i.test(plataforma) || /Macintosh/i.test(ua);
}

function mensagemErroVoz(codigo) {
  var safari = navegadorPareceSafari();
  switch (codigo) {
    case "not-allowed":
    case "service-not-allowed":
      return safari
        ? "Permita o microfone no Safari. Se o Ditado do macOS estiver desligado, ative em Ajustes do Sistema → Teclado → Ditado."
        : "Permita o microfone no navegador para usar a voz.";
    case "audio-capture":
      return "Não encontrei o microfone. Verifique se ele está disponível e se o navegador tem permissão para usá-lo.";
    case "network":
      return safari
        ? "O Safari não conseguiu usar o serviço de ditado. Ative o Ditado em Ajustes do Sistema → Teclado → Ditado e permita o microfone. Se ainda falhar, use o Google Chrome ou o Ditado do macOS (tecla Fn duas vezes) na caixa de texto."
        : "O serviço de ditado não respondeu. Verifique a internet e tente o Google Chrome, ou use o microfone do teclado.";
    case "no-speech":
      return "Não ouvi nenhuma fala. Toque em Tentar de novo e fale mais perto do microfone.";
    case "language-not-supported":
      return "O ditado em português não está disponível neste navegador. No Mac, adicione Português (Brasil) em Ajustes do Sistema → Teclado → Ditado. Ou use o microfone do teclado ou o Google Chrome.";
    default:
      return "Não foi possível ouvir. Tente de novo ou use o microfone do teclado.";
  }
}

function atualizarBotaoVoz() {
  var botao = document.querySelector('[data-action="ditar"]');
  if (!botao) return;
  botao.classList.toggle("ouvindo", voz.ouvindo);
  botao.setAttribute("aria-pressed", voz.ouvindo ? "true" : "false");
  botao.setAttribute("aria-label", voz.ouvindo ? "Parar de falar" : "Falar a pergunta");
  var rotulo = botao.querySelector(".voz-rotulo");
  if (rotulo) rotulo.textContent = voz.ouvindo ? "Parar de falar" : "Falar";
}

function atualizarStatusVoz() {
  var caixa = document.getElementById("voz-status");
  if (!caixa) return;

  if (voz.ouvindo) {
    caixa.classList.add("ativo");
    caixa.classList.remove("erro");
    var texto = juntarTextoVoz(voz.final, voz.parcial);
    caixa.innerHTML = '<div class="rotulo"><span class="ponto"></span>Estou ouvindo…</div>' +
      '<div class="parcial">' + escapeHtml(texto) + "</div>" +
      '<span class="hint">Fale devagar. Toque em <strong>Parar de falar</strong> quando terminar.</span>';
    return;
  }

  if (voz.erro && voz.erro !== "aborted") {
    caixa.classList.add("ativo", "erro");
    caixa.innerHTML = '<div class="rotulo erro-rotulo">' + ICONES.info + "Não foi possível ouvir</div>" +
      '<div class="parcial">' + escapeHtml(mensagemErroVoz(voz.erro)) + "</div>" +
      '<div class="acoes">' +
        '<button type="button" class="btn btn-secondary btn-sm" data-action="ditar">' +
          ICONES.microfone + "Tentar de novo</button>" +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="focar-campo">Usar o teclado</button>' +
      "</div>" +
      '<span class="hint">No Mac, o Ditado do sistema também funciona na caixa de texto (tecla Fn duas vezes).</span>';
    return;
  }

  caixa.classList.remove("ativo", "erro");
  caixa.innerHTML = "";
}

function obterReconhecimento() {
  var Construtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Construtor) return null;
  if (voz.reconhecimento) return voz.reconhecimento;

  var rec = new Construtor();
  rec.lang = "pt-BR";
  rec.continuous = !navegadorPareceSafari();
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = function () {
    voz.ouvindo = true;
    atualizarBotaoVoz();
    atualizarStatusVoz();
  };

  rec.onresult = function (evento) {
    var parcial = "";
    for (var i = evento.resultIndex; i < evento.results.length; i++) {
      var resultado = evento.results[i];
      var trecho = resultado[0] ? resultado[0].transcript : "";
      if (resultado.isFinal) voz.final = juntarTextoVoz(voz.final, trecho);
      else parcial = juntarTextoVoz(parcial, trecho);
    }
    voz.parcial = parcial;
    var campo = document.getElementById("pergunta");
    if (campo) {
      campo.value = juntarTextoVoz(voz.base, voz.final, voz.parcial);
      campo.scrollTop = campo.scrollHeight;
    }
    atualizarStatusVoz();
  };

  rec.onerror = function (evento) {
    var codigo = evento && evento.error ? evento.error : "";
    voz.erro = codigo;
    voz.ouvindo = false;
    voz.parcial = "";
    if (codigo === "not-allowed" || codigo === "service-not-allowed") voz.pararPedido = true;
    atualizarBotaoVoz();
    atualizarStatusVoz();
    if (codigo !== "aborted" && !document.getElementById("voz-status")) {
      toast(mensagemErroVoz(codigo));
    }
  };

  rec.onend = function () {
    voz.ouvindo = false;
    voz.parcial = "";
    var campo = document.getElementById("pergunta");
    if (campo) campo.value = juntarTextoVoz(voz.base, voz.final);
    atualizarBotaoVoz();
    atualizarStatusVoz();
  };

  voz.reconhecimento = rec;
  return rec;
}

function iniciarDitado() {
  if (!ditadoSuportado()) {
    toast("Este navegador não tem ditado por voz. Use o microfone do teclado.");
    var semVoz = document.getElementById("pergunta");
    if (semVoz) semVoz.focus();
    return;
  }
  if (!ditadoEmContextoSeguro()) {
    toast("O ditado precisa de um endereço seguro (https). Use o microfone do teclado.");
    var semSeguro = document.getElementById("pergunta");
    if (semSeguro) semSeguro.focus();
    return;
  }

  pararFala();

  var campo = document.getElementById("pergunta");
  voz.base = campo ? String(campo.value || "").trim() : "";
  voz.final = "";
  voz.parcial = "";
  voz.erro = "";
  voz.pararPedido = false;

  var rec = obterReconhecimento();
  if (!rec) return;
  try {
    rec.start();
  } catch (e) {
    toast("Não foi possível iniciar o microfone. Tente de novo.");
    voz.ouvindo = false;
    atualizarBotaoVoz();
    atualizarStatusVoz();
    return;
  }
  voz.ouvindo = true;
  atualizarBotaoVoz();
  atualizarStatusVoz();
}

function pararDitado() {
  voz.pararPedido = true;
  if (voz.reconhecimento) {
    try { voz.reconhecimento.stop(); } catch (e) { /* já parado */ }
  }
  voz.ouvindo = false;
  voz.parcial = "";
  atualizarBotaoVoz();
  atualizarStatusVoz();
}

function alternarDitado() {
  if (voz.ouvindo) pararDitado();
  else iniciarDitado();
}

function marcarFalando(ativo) {
  var botao = document.querySelector('[data-action="ouvir-resposta"]');
  if (!botao) return;
  var carregando = !!voz.ttsCarregando;
  botao.classList.toggle("falando", ativo);
  botao.classList.toggle("carregando", carregando);
  botao.setAttribute("aria-pressed", ativo ? "true" : "false");
  botao.setAttribute("aria-busy", carregando ? "true" : "false");
  var rotulo = botao.querySelector(".ouvir-rotulo");
  if (rotulo) rotulo.textContent = carregando ? "Gerando voz..." : (ativo ? "Parar leitura" : "Ouvir resposta");
}

function pararFala() {
  voz.falaToken++;
  if (voz.ttsAbort) {
    try { voz.ttsAbort.abort(); } catch (e) { /* requisição já terminou */ }
    voz.ttsAbort = null;
  }
  voz.ttsCarregando = false;
  if (window.speechSynthesis) {
    try { window.speechSynthesis.cancel(); } catch (e) { /* sem síntese de voz */ }
  }
  limparAudio();
  marcarFalando(false);
}

function falarTexto(texto) {
  var conteudo = String(texto || "").trim();
  if (!conteudo) return false;
  if (prefs.motorVoz === "natural" && ttsStatus.pronto) {
    return falarTextoNatural(conteudo);
  }
  return falarTextoNavegador(conteudo);
}

function falarTextoNavegador(texto) {
  var conteudo = String(texto || "").trim();
  if (!conteudo) return false;
  if (!falaSuportada()) {
    toast("Este navegador não consegue ler em voz alta.");
    return false;
  }
  pararFala();
  var token = ++voz.falaToken;
  var fala = new window.SpeechSynthesisUtterance(conteudo);
  var vozPreferida = vozEscolhida();
  if (vozPreferida) fala.voice = vozPreferida;
  fala.lang = (vozPreferida && vozPreferida.lang) || "pt-BR";
  fala.rate = 0.95;
  fala.pitch = 1;
  fala.volume = 1;
  fala.onend = function () { if (token === voz.falaToken) marcarFalando(false); };
  fala.onerror = function () { if (token === voz.falaToken) marcarFalando(false); };
  marcarFalando(true);
  try {
    window.speechSynthesis.speak(fala);
  } catch (e) {
    marcarFalando(false);
    toast("Não foi possível ler em voz alta neste aparelho.");
    return false;
  }
  return true;
}

function alternarFalaResposta() {
  if (falaAtiva()) {
    pararFala();
    return;
  }
  if (!ultimaResposta || ultimaResposta.tipo !== "encontrada") return;
  falarTexto(textoParaFalar(ultimaResposta.servico));
}

function falarRespostaAtual() {
  if (!prefs.lerRespostas) return;
  if (!ultimaResposta || ultimaResposta.tipo !== "encontrada") return;
  falarTexto(textoParaFalar(ultimaResposta.servico));
}

/* --------------------------- Carregar e salvar --------------------------- */
function semear() {
  lista = new ListaEncadeada();
  base = new BaseConhecimento(lista);
  DADOS_INICIAIS.forEach(function (item) {
    try { lista.inserir(Servico.deDict(item)); } catch (e) { /* registro inválido */ }
  });
  salvarServicos();
}

function carregarTudo() {
  var bruto = lerChave(CHAVES.servicos);
  if (bruto === null) {
    semear();
  } else {
    try {
      var dados = JSON.parse(bruto);
      if (!Array.isArray(dados)) throw new Error("formato inválido");
      dados.forEach(function (item) {
        try { lista.inserir(Servico.deDict(item)); } catch (e) { /* ignora registro inválido */ }
      });
    } catch (e) {
      toast("Dados salvos inválidos. Carregando os exemplos.");
      semear();
    }
  }

  var brutoHistorico = lerChave(CHAVES.historico);
  if (brutoHistorico !== null) {
    try {
      var h = JSON.parse(brutoHistorico);
      if (Array.isArray(h)) historico = h;
    } catch (e) { /* histórico inválido é ignorado */ }
  }

  var brutoPrefs = lerChave(CHAVES.prefs);
  if (brutoPrefs !== null) {
    try {
      var p = JSON.parse(brutoPrefs);
      if (p && typeof p === "object") {
        if (p.tema === "auto" || p.tema === "light" || p.tema === "dark") prefs.tema = p.tema;
        if (typeof p.fonte === "number" && p.fonte >= 0.9 && p.fonte <= 1.4) prefs.fonte = p.fonte;
        if (typeof p.nota === "number") prefs.nota = p.nota;
        if (typeof p.lerRespostas === "boolean") prefs.lerRespostas = p.lerRespostas;
        if (typeof p.vozLeitura === "string") prefs.vozLeitura = p.vozLeitura;
        if (p.motorVoz === "navegador" || p.motorVoz === "natural") prefs.motorVoz = p.motorVoz;
        if (typeof p.vozNatural === "string") prefs.vozNatural = p.vozNatural;
        if (typeof p.vozNaturalConviteVisto === "boolean") prefs.vozNaturalConviteVisto = p.vozNaturalConviteVisto;
      }
    } catch (e) { /* preferências inválidas são ignoradas */ }
  }
}

function salvarServicos() {
  var dados = lista.percorrer().map(function (s) { return s.paraDict(); });
  if (!gravarChave(CHAVES.servicos, JSON.stringify(dados))) falhaArmazenamento();
}

function salvarHistorico() {
  if (!gravarChave(CHAVES.historico, JSON.stringify(historico))) falhaArmazenamento();
}

/* ------------------------------- Atendimento ------------------------------- */
function contemDadoPessoal(texto) {
  var digitos = (String(texto).match(/\d/g) || []).length;
  return digitos >= 8 || String(texto).indexOf("@") !== -1;
}

function registrarAtendimento(dados) {
  var registro = {
    data: dataHoraAtual(),
    origem: dados.origem,
    pergunta: dados.pergunta,
    id_orientacao: dados.idOrientacao,
    encontrou: !!dados.encontrou,
    ajudou: !!dados.ajudou,
    tentativas: dados.tentativas,
    tempo: dados.tempo,
    nota_facilidade: null
  };
  historico.push(registro);
  salvarHistorico();
  return registro;
}

function perguntar(texto) {
  var pergunta = String(texto || "").trim();
  if (!pergunta) {
    toast("Escreva sua dúvida para continuar.");
    return;
  }

  if (contemDadoPessoal(pergunta)) {
    ultimaResposta = { tipo: "privacidade", pergunta: pergunta };
    render();
    return;
  }

  if (!atendimentoAtual || Date.now() - atendimentoAtual.ultimo > 120000) {
    atendimentoAtual = { inicio: Date.now(), tentativas: 0, perguntaOriginal: pergunta, ultimo: 0, registro: null };
  }
  atendimentoAtual.tentativas++;
  atendimentoAtual.ultimo = Date.now();

  var resultados = base.buscar(pergunta);
  var tempo = Math.round((Date.now() - atendimentoAtual.inicio) / 100) / 10;

  if (resultados.length && resultados[0][0] >= PONTOS_MEDIA) {
    var pontos = resultados[0][0];
    var servico = resultados[0][1];
    var confianca = pontos >= PONTOS_ALTA ? "ALTA" : "MÉDIA";
    var registro = atendimentoAtual.registro;

    if (registro) {
      registro.encontrou = true;
      registro.ajudou = false;
      registro.id_orientacao = servico.id;
      registro.tentativas = atendimentoAtual.tentativas;
      registro.tempo = tempo;
      salvarHistorico();
    } else {
      registro = registrarAtendimento({
        origem: "pergunta",
        pergunta: atendimentoAtual.perguntaOriginal,
        idOrientacao: servico.id,
        encontrou: true,
        ajudou: false,
        tentativas: atendimentoAtual.tentativas,
        tempo: tempo
      });
    }

    ultimaResposta = {
      tipo: "encontrada",
      pergunta: pergunta,
      pontos: pontos,
      confianca: confianca,
      servico: servico,
      alternativas: resultados.slice(1, 3).map(function (r) { return r[1]; }),
      registro: registro,
      feedback: null
    };
    atendimentoAtual = null;
  } else {
    var registroFalha = atendimentoAtual.registro;
    if (registroFalha) {
      registroFalha.tentativas = atendimentoAtual.tentativas;
      registroFalha.tempo = tempo;
      salvarHistorico();
    } else {
      registroFalha = registrarAtendimento({
        origem: "pergunta",
        pergunta: atendimentoAtual.perguntaOriginal,
        idOrientacao: null,
        encontrou: false,
        ajudou: false,
        tentativas: atendimentoAtual.tentativas,
        tempo: tempo
      });
      atendimentoAtual.registro = registroFalha;
    }
    ultimaResposta = {
      tipo: "nao-encontrada",
      pergunta: pergunta,
      categorias: base.categorias(),
      registro: registroFalha,
      feedback: null
    };
  }

  render();
  if (prefs.lerRespostas) falarRespostaAtual();
  setTimeout(function () {
    var alvo = document.getElementById("resultado-assistente");
    if (alvo) alvo.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 80);
}

function responderAjuda(ajudou) {
  if (!ultimaResposta || !ultimaResposta.registro) return;
  ultimaResposta.registro.ajudou = !!ajudou;
  ultimaResposta.feedback = !!ajudou;
  salvarHistorico();
  render();
  toast(ajudou ? "Que bom! Obrigado pelo retorno." : "Obrigado! Isso nos ajuda a melhorar.");
}

/* ------------------------------- Indicadores ------------------------------- */
function calcularIndicadores() {
  var total = historico.length;
  var encontrados = historico.filter(function (r) { return r.encontrou; }).length;
  var ajudaram = historico.filter(function (r) { return r.ajudou; }).length;
  var tempos = historico.filter(function (r) { return r.encontrou; }).map(function (r) { return Number(r.tempo) || 0; });
  var tentativas = historico.map(function (r) { return Number(r.tentativas) || 1; });
  var notas = historico.map(function (r) { return r.nota_facilidade; }).filter(function (n) {
    return typeof n === "number" && n >= 1 && n <= 5;
  });
  if (!notas.length && typeof prefs.nota === "number") notas.push(prefs.nota);

  var semSolucao = [];
  historico.forEach(function (r) {
    if (!r.ajudou && r.pergunta && semSolucao.indexOf(r.pergunta) === -1) semSolucao.push(r.pergunta);
  });

  return {
    total: total,
    encontrados: encontrados,
    ajudaram: ajudaram,
    percentualEncontrados: total ? 100 * encontrados / total : 0,
    percentualAjudaram: total ? 100 * ajudaram / total : 0,
    tempoMedio: tempos.length ? tempos.reduce(function (a, b) { return a + b; }, 0) / tempos.length : 0,
    tentativasMedias: total ? tentativas.reduce(function (a, b) { return a + b; }, 0) / total : 0,
    facilidade: notas.length ? notas.reduce(function (a, b) { return a + b; }, 0) / notas.length : null,
    semSolucao: semSolucao
  };
}

function definirNota(nota) {
  prefs.nota = nota;
  if (historico.length) {
    historico[historico.length - 1].nota_facilidade = nota;
    salvarHistorico();
  }
  salvarPrefs();
}

/* --------------------------------- CSV --------------------------------- */
var CAMPOS_CSV = ["data", "origem", "pergunta", "id_orientacao", "encontrou", "ajudou", "tentativas", "tempo", "nota_facilidade"];

function celulaCsv(valor) {
  var texto = valor === null || valor === undefined ? "" : String(valor);
  if (/[",\n\r;]/.test(texto)) return '"' + texto.replace(/"/g, '""') + '"';
  return texto;
}

function gerarCSV() {
  var linhas = [CAMPOS_CSV.join(",")];
  historico.forEach(function (r) {
    linhas.push(CAMPOS_CSV.map(function (campo) { return celulaCsv(r[campo]); }).join(","));
  });
  return "\ufeff" + linhas.join("\r\n");
}

function baixarArquivo(blob, nome) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = nome;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    if (a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1200);
}

async function compartilharOuBaixar(blob, nome, tipo, titulo) {
  try {
    var arquivo = new File([blob], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      await navigator.share({ files: [arquivo], title: titulo });
      return "compartilhado";
    }
  } catch (e) {
    if (e && e.name === "AbortError") return "cancelado";
  }
  baixarArquivo(blob, nome);
  return "baixado";
}

async function exportarCSV() {
  var blob = new Blob([gerarCSV()], { type: "text/csv;charset=utf-8" });
  var resultado = await compartilharOuBaixar(
    blob,
    "atendimentos.csv",
    "text/csv",
    "Atendimentos do Citizen Assist"
  );
  if (resultado === "compartilhado") toast("CSV compartilhado.");
  else if (resultado === "baixado") toast("CSV gerado (" + historico.length + " atendimento(s)).");
}

async function exportarBackup() {
  var dados = {
    app: "Citizen Assist AI",
    versao: "2.0-mobile",
    exportado_em: new Date().toISOString(),
    servicos: lista.percorrer().map(function (s) { return s.paraDict(); }),
    historico: historico,
    prefs: prefs
  };
  var blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
  var resultado = await compartilharOuBaixar(
    blob,
    "citizen-assist-backup.json",
    "application/json",
    "Backup do Citizen Assist"
  );
  if (resultado === "compartilhado") toast("Backup compartilhado.");
  else if (resultado === "baixado") toast("Backup gerado.");
}

function importarBackup(arquivo) {
  var leitor = new FileReader();
  leitor.onload = async function () {
    try {
      var dados = JSON.parse(leitor.result);
      var servicos = Array.isArray(dados) ? dados : dados.servicos;
      if (!Array.isArray(servicos)) throw new Error("formato inválido");

      var ok = await confirmar("Substituir os dados atuais por " + servicos.length + " serviço(s) do backup?", {
        titulo: "Importar backup",
        texto: "Importar"
      });
      if (!ok) return;

      var nova = new ListaEncadeada();
      servicos.forEach(function (item) {
        try { nova.inserir(Servico.deDict(item)); } catch (e) { /* ignora inválido */ }
      });
      lista = nova;
      base = new BaseConhecimento(lista);

      if (!Array.isArray(dados) && Array.isArray(dados.historico)) historico = dados.historico;
      if (!Array.isArray(dados) && dados.prefs && typeof dados.prefs === "object") {
        if (dados.prefs.tema === "auto" || dados.prefs.tema === "light" || dados.prefs.tema === "dark") {
          prefs.tema = dados.prefs.tema;
        }
        if (typeof dados.prefs.fonte === "number" && dados.prefs.fonte >= 0.9 && dados.prefs.fonte <= 1.4) {
          prefs.fonte = dados.prefs.fonte;
        }
        if (typeof dados.prefs.nota === "number") prefs.nota = dados.prefs.nota;
        if (typeof dados.prefs.lerRespostas === "boolean") prefs.lerRespostas = dados.prefs.lerRespostas;
        if (typeof dados.prefs.vozLeitura === "string") prefs.vozLeitura = dados.prefs.vozLeitura;
        if (dados.prefs.motorVoz === "navegador" || dados.prefs.motorVoz === "natural") {
          prefs.motorVoz = dados.prefs.motorVoz;
        }
        if (typeof dados.prefs.vozNatural === "string") prefs.vozNatural = dados.prefs.vozNatural;
        if (typeof dados.prefs.vozNaturalConviteVisto === "boolean") {
          prefs.vozNaturalConviteVisto = dados.prefs.vozNaturalConviteVisto;
        }
        salvarPrefs();
        aplicarPreferencias();
      }
      salvarServicos();
      salvarHistorico();
      ultimaResposta = null;
      filtro = { texto: "", categoria: "", ordenacao: "atual" };
      render();
      toast("Backup importado.");
    } catch (e) {
      toast("Arquivo inválido. Use um backup do próprio app.");
    }
  };
  leitor.readAsText(arquivo, "utf-8");
}

/* ------------------------------ Componentes ------------------------------ */
function cartaoServico(s) {
  var meta = s.documentos.length + " documento(s)";
  if (s.local) meta += " · " + resumir(s.local, 42);
  return '<button class="service-card" data-action="abrir-servico" data-id="' + s.id + '">' +
    '<span class="chip chip-cat">' + escapeHtml(s.categoria) + "</span>" +
    '<span class="service-title">' + escapeHtml(s.titulo) + "</span>" +
    '<span class="service-desc">' + escapeHtml(resumir(s.descricao, 130)) + "</span>" +
    '<span class="service-meta">' + escapeHtml(meta) + "</span>" +
    "</button>";
}

function vazio(titulo, texto, acao, rotuloAcao) {
  var botao = acao ? '<button class="btn btn-primary" data-action="' + escapeAttr(acao) + '">' + escapeHtml(rotuloAcao) + "</button>" : "";
  return '<div class="empty"><div class="big" aria-hidden="true">🔎</div><strong>' + escapeHtml(titulo) + "</strong><p>" + escapeHtml(texto) + "</p>" + botao + "</div>";
}

function itensFiltrados() {
  var itens = filtro.texto ? lista.pesquisar(filtro.texto) : lista.percorrer();
  if (filtro.categoria) {
    var chave = normalizar(filtro.categoria);
    itens = itens.filter(function (s) { return normalizar(s.categoria) === chave; });
  }
  return itens;

/* --------------------------------- Análise --------------------------------- */
function renderAnalise() {
  var itens = lista.percorrer();
  var html = '<button class="back-btn" data-action="voltar">' + ICONES.voltar + " Voltar</button>" +
    '<div class="view-head"><div><h1>Análise dos serviços</h1><p>Dados do catálogo atual</p></div></div>';

  if (!itens.length) {
    return html + vazio("Catálogo vazio", "Cadastre serviços para gerar a análise.", "novo-servico", "Cadastrar serviço");
  }

  var contagem = lista.contarPorCategoria();
  var arr = Object.keys(contagem).map(function (c) { return [c, contagem[c]]; });
  insertionSort(arr, function (a, b) {
    if (a[1] !== b[1]) return b[1] - a[1];
    var na = normalizar(a[0]), nb = normalizar(b[0]);
    return na < nb ? -1 : (na > nb ? 1 : 0);
  });

  var total = lista.quantidade;
  var maximo = arr.length ? arr[0][1] : 1;
  var semPalavras = itens.filter(function (s) { return !s.palavras_chave.length; }).length;
  var semFonte = itens.filter(function (s) { return !s.fonte; }).length;
  var totalPalavras = itens.reduce(function (acc, s) { return acc + s.palavras_chave.length; }, 0);
  var mediaPalavras = total ? totalPalavras / total : 0;

  html += '<div class="metric-grid">' +
    '<div class="metric"><strong>' + total + "</strong><span>registros no catálogo</span></div>" +
    '<div class="metric"><strong>' + arr.length + "</strong><span>categorias diferentes</span></div>" +
    "</div>";

  html += '<h2 class="section-title">Serviços por categoria</h2><div class="more-group"><div class="about-block">' +
    arr.map(function (par) {
      var pct = 100 * par[1] / total;
      var largura = Math.round(100 * par[1] / maximo);
      return '<div class="bar-row"><div class="bar-label"><strong>' + escapeHtml(par[0]) + "</strong><span>" + par[1] + " (" + pct.toFixed(1) + "%)</span></div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + largura + '%"></div></div></div>';
    }).join("") +
    '<p class="hint" style="margin:12px 0 0">Categoria com mais serviços: <strong>' + escapeHtml(arr[0][0]) + "</strong></p>" +
    "</div></div>";

  html += '<h2 class="section-title">Qualidade dos registros</h2><div class="metric-grid">' +
    '<div class="metric"><strong>' + semPalavras + "</strong><span>sem palavras-chave</span></div>" +
    '<div class="metric"><strong>' + semFonte + "</strong><span>sem fonte oficial</span></div>" +
    '<div class="metric"><strong>' + totalPalavras + "</strong><span>palavras-chave</span></div>" +
    '<div class="metric"><strong>' + mediaPalavras.toFixed(1) + "</strong><span>média por registro</span></div>" +
    "</div>";

  return html;
}

/* ------------------------------ Renderização ------------------------------ */
function render() {
  if (state.screen !== "assistente") {
    if (voz.ouvindo) pararDitado();
    if (falaAtiva()) pararFala();
  }
  aplicarPreferencias();
  var view = document.getElementById("view");
  if (!view) return;
  var html = "";
  switch (state.screen) {
    case "home": html = renderHome(); break;
    case "servicos": html = renderServicos(); break;
    case "assistente": html = renderAssistente(); break;
    case "categorias": html = renderCategorias(); break;
    case "categoria": html = renderCategoria(); break;
    case "mais": html = renderMais(); break;
    case "analise": html = renderAnalise(); break;
    case "indicadores": html = renderIndicadores(); break;
    case "historico": html = renderHistorico(); break;
    case "aparencia": html = renderAparencia(); break;
    case "sobre": html = renderSobre(); break;
    default: html = renderHome();
  }
  if (!storageOk) html = bannerArmazenamento() + html;
  view.innerHTML = html;
  atualizarTabbar();
  bindView();
}

function atualizarTabbar() {
  var grupos = {
    home: ["home", "categorias", "categoria"],
    servicos: ["servicos"],
    assistente: ["assistente"],
    mais: ["mais", "analise", "indicadores", "historico", "aparencia", "sobre"]
  };
  var ativo = "home";
  Object.keys(grupos).forEach(function (chave) {
    if (grupos[chave].indexOf(state.screen) !== -1) ativo = chave;
  });
  var abas = document.querySelectorAll(".tab");
  for (var i = 0; i < abas.length; i++) {
    var aba = abas[i];
    var ehAtiva = aba.getAttribute("data-tab") === ativo;
    aba.classList.toggle("ativo", ehAtiva);
    if (ehAtiva) aba.setAttribute("aria-current", "page");
    else aba.removeAttribute("aria-current");
  }
}

/* -------------------------------- Navegação -------------------------------- */
var historyOk = true;
var navegacoes = 0;
var pilha = [{ tela: "home", params: {} }];

function go(tela, params) {
  params = params || {};
  fecharSheet(false);
  if (state.screen === tela && JSON.stringify(state.params) === JSON.stringify(params)) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (historyOk) {
    try {
      history.pushState({ tela: tela, params: params }, "");
      navegacoes++;
    } catch (e) {
      historyOk = false;
    }
  }
  if (!historyOk) pilha.push({ tela: tela, params: params });
  state.screen = tela;
  state.params = params;
  render();
  window.scrollTo(0, 0);
}

function voltar() {
  if (sheetAberto) { fecharSheet(); return; }
  if (historyOk && navegacoes > 0) {
    history.back();
    return;
  }
  if (!historyOk && pilha.length > 1) {
    pilha.pop();
    var topo = pilha[pilha.length - 1];
    state.screen = topo.tela;
    state.params = topo.params;
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (state.screen !== "home") {
    go("home");
  } else {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

/* ------------------------------ Folha inferior ------------------------------ */
function abrirSheet(conteudo, aoAbrir) {
  var root = document.getElementById("sheet-root");
  root.innerHTML = '<div class="overlay" data-overlay><div class="sheet" role="dialog" aria-modal="true">' + conteudo + "</div></div>";
  sheetAberto = true;
  document.body.classList.add("sem-rolagem");
  var overlay = root.firstElementChild;
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) fecharSheet();
  });
  if (typeof aoAbrir === "function") aoAbrir();
}

function fecharSheet() {
  if (!sheetAberto) return;
  sheetAberto = false;
  var root = document.getElementById("sheet-root");
  if (root) root.innerHTML = "";
  document.body.classList.remove("sem-rolagem");
}

    '<div class="field"><label for="f-categoria">Categoria *</label><input id="f-categoria" name="categoria" type="text" list="lista-categorias" value="' + escapeAttr(valor("categoria")) + '" placeholder="Ex.: Saúde">' +

    '<div class="field"><label for="f-palavras">Palavras-chave</label><input id="f-palavras" name="palavras" type="text" value="' + escapeAttr(s ? s.palavras_chave.join(", ") : "") + '" placeholder="cartao sus, sus, cns">' +
